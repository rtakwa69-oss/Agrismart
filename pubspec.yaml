
name: agrismart
description: "Agrismart Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0

  # API
  http: ^1.6.0

  # Local Storage
  shared_preferences: ^2.5.6

  # GPS Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Charts
  fl_chart: ^0.68.0

  # Notifications locales
  flutter_local_notifications: 19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
